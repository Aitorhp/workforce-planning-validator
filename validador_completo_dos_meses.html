<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validador de planificaciones</title></head><body><p style="font-family:system-ui;padding:24px">Cargando validador…</p>
<script src="html_assets/payload_1.js"></script>
<script src="html_assets/payload_2.js"></script>
<script src="html_assets/payload_3.js"></script>
<script src="html_assets/payload_4.js"></script>
<script src="html_assets/payload_5.js"></script>
<script>(async()=>{try{const b=Uint8Array.from(atob(window.__WFV_PAYLOAD),c=>c.charCodeAt(0));const stream=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML="<pre>Error al cargar el validador: "+String(e)+"</pre>";}})();</script></body></html>
