name: Build distributable HTML

on:
  push:
    paths:
      - 'html_assets/reference_payload_*.js'
      - 'scripts/build_distributable_html.py'
      - 'scripts/weekend_html_patch.py'
      - '.github/workflows/build-distributable-html.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-distributable-html-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate and capture diagnostics
        shell: bash
        run: |
          set +e
          python scripts/build_distributable_html.py > standalone/build_debug.txt 2>&1
          status=$?
          echo "exit_status=$status" >> standalone/build_debug.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standalone/build_debug.txt
          if [ -f validador_distribuible.html ]; then git add validador_distribuible.html; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Diagnosticar generación HTML'
            git push origin HEAD:${{ github.ref_name }}
          fi
          exit $status
