<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validador de planificaciones</title><style>body{font:14px system-ui;margin:0;background:#f4f7fb;color:#172033}.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}aside{background:#142033;color:#fff;padding:18px;position:sticky;top:0;height:100vh;box-sizing:border-box}main{padding:22px}.drop{border:2px dashed #738199;border-radius:10px;padding:18px;text-align:center;cursor:pointer}.box,.card{background:#fff;border:1px solid #dbe2ec;border-radius:10px;padding:13px;margin:10px 0}.tabs{display:flex;gap:3px;flex-wrap:wrap;border-bottom:2px solid #dbe2ec}.tabs button{border:0;background:none;padding:9px 10px;cursor:pointer}.tabs .on{color:#2463eb;border-bottom:3px solid #2463eb}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card b{font-size:22px;display:block}.muted{color:#667085}.warn{background:#fff4d6;border:1px solid #f7c948;padding:10px;border-radius:8px}.ok{background:#e6f8ec;border:1px solid #86d39c;padding:10px;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:7px;border-bottom:1px solid #e8edf4;text-align:left}th{background:#254d78;color:white;position:sticky;top:0}.scroll{overflow:auto;max-height:480px}.bar{height:18px;background:#e5eaf1;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#2463eb}.row{display:grid;grid-template-columns:150px 1fr 80px;gap:8px;align-items:center;margin:6px 0}select{width:100%;padding:7px;margin:5px 0 10px}.empty{padding:22px;text-align:center;color:#667085;border:1px dashed #c8d0dc;border-radius:8px}.small{font-size:12px;color:#9aa6b5}@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.k{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="app"><aside><h2>Validador</h2><div class="small">HTML distribuible · JSON reducido</div><br><div class="drop" id="drop"><b>Arrastra o haz clic</b><br><small>JSON/TXT</small></div><input id="file" type="file" accept=".json,.txt" hidden><div id="side"></div></aside><main><h1>Validador de planificaciones</h1><div id="msg" class="box">Carga un fichero. Esta variante admite ausencia de <code>store</code> y <code>people[].person</code>.</div><div id="tabs"></div><div id="out"></div></main></div><script>
const T=['Resumen','Restricciones','Horas contractuales','Cobertura diaria','Balance mañana/tarde','Ausencias','Fines de semana','Mix de plantilla','Metodología'],S={d:null,src:'effective',tab:0,r:null},$=q=>document.querySelector(q),fmt=(x,d=1)=>x==null||!isFinite(x)?'—':Number(x).toLocaleString('es-ES',{maximumFractionDigits:d}),esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function day(s){return String(s||'').slice(0,10)}function wd(s){let d=new Date(day(s)+'T00:00:00Z').getUTCDay();return(d+6)%7}function work(a){return(a||[]).filter(x=>String(x.hourType||'').toUpperCase()==='WORK')}function pick(D,t,src){if(src!=='effective')return work(t[src]);let st=D.status||{};if(st.hasPlannedDraft===true)return work(t.plannedDraft);if(st.publishedPlanned===true||st.validatedPlanned===true)return work(t.planned);let q=work(t.plannedDraft);return q.length?q:work(t.planned)}function dur(s){let a=new Date(s.startDateTime),b=new Date(s.endDateTime);return(b-a)/36e5}function sum(a){return a.reduce((x,y)=>x+(+y||0),0)}function uniq(a){return[...new Set(a)]}function group(a,f){let m=new Map;for(let x of a){let k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)}return m}function profile(d){let ids=new Set,nested=0,contracts=0,names=0,worked=0,inouts=0,abs=0;for(let D of d.storeDayTimes||[])for(let p of D.people||[]){ids.add(String(p.personId));if(p.person){nested++;if(isFinite(p.person.applicableWorkingHours))contracts++;if(p.person.name||p.person.firstLastName)names++}let t=p.dayTimes||{};worked+=(t.worked||[]).length;inouts+=(t.inOuts||[]).length;abs+=(t.absences||[]).length}return{ids:ids.size,nested,contracts,names,worked,inouts,abs,store:d.store?.id??null}}
function extract(d,src){let shifts=[],abs=[],emps=new Map,dates=[];for(let D of d.storeDayTimes||[]){if(!D.operatingDate)continue;let dt=day(D.operatingDate);dates.push(dt);for(let p of D.people||[]){let id=p.personId,pm=p.person||{},c=isFinite(pm.applicableWorkingHours)?+pm.applicableWorkingHours:null;if(!emps.has(String(id)))emps.set(String(id),{id,c,name:[pm.name,pm.firstLastName,pm.secondLastName].filter(Boolean).join(' ')});let t=p.dayTimes||{};for(let a of t.absences||[])if(['VALIDATED','APPROVED'].includes(String(a.status||'').toUpperCase()))abs.push({id,date:dt,type:a.type?.name||a.type?.description||a.id||'AUSENCIA'});let seg=pick(D,t,src);if(!seg.length)continue;let h=sum(seg.map(dur)),st=seg.map(x=>new Date(x.startDateTime)).sort((a,b)=>a-b)[0],en=seg.map(x=>new Date(x.endDateTime)).sort((a,b)=>b-a)[0];shifts.push({id,date:dt,h,start:st,end:en,c,period:st.getHours()<13?'Mañana':'Tarde'})}}
let inc=[];for(let s of shifts){if(s.h>7.5)inc.push({id:s.id,date:s.date,type:'Turno > 7,5 h'});if(s.h<4)inc.push({id:s.id,date:s.date,type:'Turno < 4 h'})}for(let [id,a] of group(shifts,x=>String(x.id))){a.sort((x,y)=>x.start-y.start);for(let i=1;i<a.length;i++)if((a[i].start-a[i-1].end)/36e5<11)inc.push({id,date:a[i].date,type:'Descanso < 11 h'});let ds=uniq(a.map(x=>x.date)).sort(),run=1;for(let i=1;i<=ds.length;i++){if(i<ds.length&&(new Date(ds[i])-new Date(ds[i-1]))===864e5)run++;else{if(run>5)inc.push({id,date:ds[i-1],type:'> 5 días consecutivos'});run=1}}}return{shifts,abs,emps,dates:uniq(dates).sort(),inc}}
function cards(a){return'<div class="k">'+a.map(x=>`<div class="card"><span class="muted">${esc(x[0])}</span><b>${x[1]}</b><small>${esc(x[2]||'')}</small></div>`).join('')+'</div>'}function tbl(cols,rows){return'<div class="scroll"><table><thead><tr>'+cols.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>`<td>${r[c]??''}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>'}function bars(a){let mx=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class="row"><span>${esc(x[0])}</span><div class="bar"><i style="width:${100*x[1]/mx}%"></i></div><b>${esc(x[2]??x[1])}</b></div>`).join('')||'<div class="empty">Sin datos</div>'}
function summary(r){let bad=uniq(r.inc.map(x=>String(x.id))).length;return cards([['Empleados',r.emps.size,'personId únicos'],['Turnos',r.shifts.length,'días-persona'],['Horas',fmt(sum(r.shifts.map(x=>x.h)))+' h','WORK'],['Con incidencias',bad,'restricciones']])+`<div class=box><h3>Incidencias</h3>${bars([...group(r.inc,x=>x.type)].map(([k,v])=>[k,v.length]))}</div>`}
function restrictions(r){return cards(['> 5 días consecutivos','Turno > 7,5 h','Turno < 4 h','Descanso < 11 h'].map(t=>[t,uniq(r.inc.filter(x=>x.type===t).map(x=>x.id)).length,'empleados']))+`<div class=box><h3>Detalle</h3>${tbl(['personId','Fecha','Regla'],r.inc.map(x=>({personId:x.id,Fecha:x.date,Regla:x.type})))}</div>`}
function contracts(r){let p=profile(S.d);return `<h2>Horas contractuales</h2>${p.contracts?'':`<div class=warn>Sin datos: falta <code>person.applicableWorkingHours</code>. Se mantienen KPIs, mapa y tabla.</div>`}${cards([['Empleado-semanas evaluables',p.contracts?'0':'—',''],['Coinciden',p.contracts?'0':'—',''],['Déficit',p.contracts?'0':'—',''],['Exceso',p.contracts?'0':'—','']])}<div class=box><h3>Mapa empleado-semana</h3><div class=empty>${p.contracts?'Sin registros calculados':'Sin datos contractuales'}</div></div><div class=box><h3>Detalle empleado-semana</h3>${tbl(['Semana','personId','Horas contrato','Horas planificadas','Desviación','Estado'],[])}</div>`}
function coverage(r){let a=r.dates.map(d=>{let x=r.shifts.filter(s=>s.date===d);return[d,sum(x.map(s=>s.h)),uniq(x.map(s=>s.id)).length]});return cards([['Horas planificadas',fmt(sum(a.map(x=>x[1])))+' h',''],['Media diaria',fmt(sum(a.map(x=>x[1]))/Math.max(1,a.length))+' h',''],['Días con cobertura',a.filter(x=>x[1]>0).length,''],['Días sin horas',a.filter(x=>!x[1]).length,'']])+`<div class=box><h3>Evolución diaria</h3>${bars(a.map(x=>[x[0],x[1],fmt(x[1])+' h']))}</div>`}
function balance(r){let g=[...group(r.shifts,x=>String(x.id))].map(([id,a])=>({id,m:a.filter(x=>x.period==='Mañana').length,t:a.filter(x=>x.period==='Tarde').length}));return cards([['Empleados',g.length,''],['Mañana y tarde',g.filter(x=>x.m&&x.t).length,''],['Solo mañanas',g.filter(x=>x.m&&!x.t).length,''],['Solo tardes',g.filter(x=>!x.m&&x.t).length,'']])+`<div class=box>${tbl(['personId','Mañana','Tarde'],g.map(x=>({personId:x.id,Mañana:x.m,Tarde:x.t})))}</div>`}
function absences(r){let g=group(r.abs,x=>x.type);return cards([['Ausencias',r.abs.length,'VALIDATED/APPROVED'],['Empleados afectados',uniq(r.abs.map(x=>x.id)).length,''],['Tipos',g.size,''],['Días con ausencias',uniq(r.abs.map(x=>x.date)).length,'']])+`<div class=box><h3>Por tipo</h3>${bars([...g].map(([k,v])=>[k,v.length]))}</div>`}
function weekends(r){let sats=r.dates.filter(d=>wd(d)===5),pairs=sats.filter(s=>r.dates.includes(new Date(new Date(s).getTime()+864e5).toISOString().slice(0,10))),worked=new Set(r.shifts.map(x=>x.id+'|'+x.date)),rows=[...r.emps.values()].map(e=>{let full=pairs.filter(s=>{let su=new Date(new Date(s).getTime()+864e5).toISOString().slice(0,10);return!worked.has(e.id+'|'+s)&&!worked.has(e.id+'|'+su)}).length;return{id:e.id,c:e.c,full}});return cards([['Empleados analizados',rows.length,'personId'],['Fines evaluables',pairs.length,''],['Con algún fin completo',rows.filter(x=>x.full>0).length,''],['Sin fin completo',rows.filter(x=>!x.full).length,'']])+`<div class=box><h3>Rotación / magnitud</h3>${bars(pairs.map(s=>{let su=new Date(new Date(s).getTime()+864e5).toISOString().slice(0,10),n=rows.filter(e=>!worked.has(e.id+'|'+s)&&!worked.has(e.id+'|'+su)).length;return[s,n,n+' empleados']}))}</div><div class=box><h3>Mapa empleado-fin de semana</h3>${tbl(['personId','Horas contrato','Fines completos'],rows.map(x=>({personId:x.id,'Horas contrato':x.c??'', 'Fines completos':x.full})))}</div>`}
function mix(r){let e=[...r.emps.values()].filter(x=>x.c!=null),g=group(e,x=>x.c);return `<h2>Mix de plantilla</h2>${e.length?'':'<div class=warn>No hay información contractual suficiente. Los objetos permanecen visibles sin datos.</div>'}${cards([['Empleados',e.length?e.length:'—','con contrato'],['Tipos de contrato',e.length?g.size:'—',''],['Horas contratadas',e.length?fmt(sum(e.map(x=>x.c)))+' h':'—',''],['Jornada media',e.length?fmt(sum(e.map(x=>x.c))/e.length)+' h':'—','']])}<div class=box><h3>Distribución</h3>${e.length?bars([...g].map(([k,v])=>[k+' h',v.length])):'<div class=empty>Sin datos contractuales</div>'}</div><div class=box><h3>Detalle del mix</h3>${tbl(['Horas contrato','Empleados','% plantilla'],e.length?[...g].map(([k,v])=>({'Horas contrato':k,Empleados:v.length,'% plantilla':fmt(100*v.length/e.length)+'%'})):[])}</div>`}
function method(r){let p=profile(S.d),a=[['store.id',p.store!=null,'Identificación de tienda'],['people[].person',p.nested>0,'Nombre/sección/puesto/contrato'],['person.applicableWorkingHours',p.contracts>0,'Control contractual y Mix'],['people[].personId',p.ids>0,'Identificador empleado'],['planned / plannedDraft',r.shifts.length>0,'Turnos y reglas'],['absences',p.abs>0,'Ausencias'],['worked / inOuts',p.worked||p.inouts,'Fichajes reales']];return '<h2>Disponibilidad e impacto</h2>'+tbl(['Campo','Disponible','Impacto'],a.map(x=>({Campo:x[0],Disponible:x[1]?'Sí':'No',Impacto:x[2]})))+'<div class=box><b>Plan efectivo:</b> usa <code>planned</code> cuando el día está publicado/validado y <code>plannedDraft</code> cuando <code>hasPlannedDraft=true</code>. No se inventan datos ausentes.</div>'}
function render(){let f=[summary,restrictions,contracts,coverage,balance,absences,weekends,mix,method];$('#tabs').innerHTML='<div class=tabs>'+T.map((x,i)=>`<button class=${i===S.tab?'on':''} data-i=${i}>${x}</button>`).join('')+'</div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.i;render()});$('#out').innerHTML=f[S.tab](S.r)}
function choose(src){S.src=src;S.r=extract(S.d,src);let p=profile(S.d);$('#side').innerHTML=`<br><label>Origen</label><select id=src><option value=effective>Plan efectivo</option><option value=planned>Plan publicado</option><option value=plannedDraft>Borrador</option></select><div class=small>Tienda: ${p.store??''}<br>Empleados: ${p.ids}<br>Contratos: ${p.contracts?'sí':'no'}<br>Nombres: ${p.names?'sí':'no'}</div>`;$('#src').value=src;$('#src').onchange=e=>choose(e.target.value);$('#msg').innerHTML=`<div class=ok><b>Fichero cargado.</b> ${p.ids} empleados · ${S.r.dates.length} fechas · ${S.r.shifts.length} turnos del origen seleccionado.</div>`;S.tab=0;render()}
async function load(f){try{let d=JSON.parse((await f.text()).replace(/^\ufeff/,''));if(!Array.isArray(d.storeDayTimes))throw Error('storeDayTimes no es una lista');S.d=d;choose('effective');$('#drop').innerHTML='<b>'+esc(f.name)+'</b><br><small>Haz clic para cambiar</small>'}catch(e){$('#msg').innerHTML='<div class=warn>'+esc(e.message)+'</div>'}}let fi=$('#file'),dr=$('#drop');dr.onclick=()=>fi.click();fi.onchange=e=>load(e.target.files[0]);dr.ondragover=e=>e.preventDefault();dr.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
</script></body></html>
